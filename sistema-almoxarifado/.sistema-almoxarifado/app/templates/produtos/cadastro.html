{% extends "base.html" %}
{% set active_page = "prod_cadastro" %}

{% block content %}
<div class="view-header">
  <div>
    <h2 class="page-title">Cadastrar Novo Produto</h2>
    <p class="page-subtitle">Preencha as informações para registrar o material no catálogo.</p>
  </div>
  <a href="/produtos/html/lista" class="btn btn-secondary">Voltar ao Catálogo</a>
</div>

<div class="card panel-card" style="max-width: 750px;">
  <form id="form-cadastrar-produto" onsubmit="salvarNovoProduto(event)">
    <div class="form-grid">
      
      <!-- Nome do Produto -->
      <div class="form-group full-width">
        <label>Nome do Produto / Material</label>
        <input type="text" name="nome" class="form-control" placeholder="Ex: Toner HP 105A" required />
      </div>

      <!-- Categoria -->
      <div class="form-group">
        <label>Categoria</label>
        <input type="text" name="categoria" class="form-control" placeholder="Ex: Informática" />
      </div>

      <!-- NOVO: Unidade de Medida / Volume -->
      <div class="form-group">
        <label>Unidade de Medida / Volume</label>
        <select name="unidade" class="form-control" required>
          <option value="UN" selected>Unidade (UN)</option>
          <option value="PCT">Pacote (PCT)</option>
          <option value="CX">Caixa (CX)</option>
          <option value="KG">Quilograma (KG)</option>
          <option value="L">Litro (L)</option>
          <option value="FD">Fardo (FD)</option>
          <option value="RESMA">Resma (RESMA)</option>
        </select>
      </div>

      <!-- Estoque Mínimo -->
      <div class="form-group">
        <label>Estoque Mínimo</label>
        <input type="number" name="estoque_minimo" class="form-control" value="10" min="0" required />
      </div>

    </div>

    <!-- Descrição Detalhada -->
    <div class="form-group full-width" style="margin-top: 1rem;">
      <label>Descrição Detalhada</label>
      <textarea name="descricao" class="form-control" rows="3" placeholder="Especificações técnicas, modelo, marca..."></textarea>
    </div>

    <div class="modal-footer" style="padding-top: 1rem;">
      <button type="submit" class="btn btn-dark-blue">Salvar Produto</button>
    </div>
  </form>
</div>
{% endblock %}

{% extends "base.html" %}
{% set active_page = "prod_cadastro" %}

{% block content %}
<div class="view-header">
  <div>
    <h2 class="page-title">Cadastrar Novo Produto</h2>
    <p class="page-subtitle">Preencha as informações para registrar o material no catálogo.</p>
  </div>
  <a href="/produtos/html/lista" class="btn btn-secondary">Voltar ao Catálogo</a>
</div>

<div class="card panel-card" style="max-width: 750px;">
  <form id="form-cadastrar-produto" onsubmit="salvarNovoProduto(event)">
    <div class="form-grid">
      
      <!-- Nome do Produto -->
      <div class="form-group full-width">
        <label>Nome do Produto / Material</label>
        <input type="text" name="nome" class="form-control" placeholder="Ex: Papel A4 Report" required />
      </div>

      <!-- Categoria -->
      <div class="form-group">
        <label>Categoria</label>
        <input type="text" name="categoria" class="form-control" placeholder="Ex: Papelaria" />
      </div>

      <!-- Unidade de Medida -->
      <div class="form-group">
        <label>Unidade de Medida / Volume</label>
        <select name="unidade" class="form-control" required>
          <option value="UN" selected>Unidade (UN)</option>
          <option value="PCT">Pacote (PCT)</option>
          <option value="CX">Caixa (CX)</option>
          <option value="KG">Quilograma (KG)</option>
          <option value="L">Litro (L)</option>
          <option value="FD">Fardo (FD)</option>
          <option value="RESMA">Resma (RESMA)</option>
        </select>
      </div>

      <!-- Estoque Mínimo -->
      <div class="form-group">
        <label>Estoque Mínimo</label>
        <input type="number" name="estoque_minimo" class="form-control" value="10" min="0" required />
      </div>

    </div>

    <!-- Descrição Detalhada -->
    <div class="form-group full-width" style="margin-top: 1rem;">
      <label>Descrição Detalhada</label>
      <textarea name="descricao" class="form-control" rows="3" placeholder="Especificações técnicas, modelo, marca..."></textarea>
    </div>

    <div class="modal-footer" style="padding-top: 1rem;">
      <button type="submit" id="btn-salvar-produto" class="btn btn-dark-blue">Salvar Produto</button>
    </div>
  </form>
</div>

<script>
  async function salvarNovoProduto(event) {
    event.preventDefault();
    const form = event.target;
    const btn = document.getElementById('btn-salvar-produto');

    const payload = {
      nome: form.nome.value.trim(),
      categoria: form.categoria.value.trim() || null,
      unidade: form.unidade.value,
      estoque_minimo: parseInt(form.estoque_minimo.value) || 0,
      descricao: form.descricao.value.trim() || null
    };

    btn.disabled = true;
    btn.innerText = 'Salvando...';

    try {
      const res = await fetch('/produtos/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Erro ao cadastrar produto.');

      alert('Cadastro concluído com sucesso!');
      window.location.href = '/produtos/html/lista';
    } catch (error) {
      alert('Erro: ' + error.message);
      btn.disabled = false;
      btn.innerText = 'Salvar Produto';
    }
  }
</script>
{% endblock %}
